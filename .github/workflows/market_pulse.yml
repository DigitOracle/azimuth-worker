# Market Pulse — daily collector (MEED-only v1)
# Pulls Digital Abbot Cloud aggregates and pushes them to the azimuth-2 Worker.
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   DAC_KEY          Digital Abbot Cloud key
#   AZIMUTH_2_URL    https://azimuth-2.<subdomain>.workers.dev
#   AZ2_INGEST_TOKEN azimuth-2's INGEST_TOKEN
name: market-pulse
on:
  schedule:
    - cron: "30 6 * * *"        # 06:30 UTC = 10:30 GST — daily, AFTER the corpus's ~05:00 UTC sync
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and push
        env:
          DAC_KEY: ${{ secrets.DAC_KEY }}
          AZIMUTH_URL: ${{ secrets.AZIMUTH_2_URL }}
          INGEST_TOKEN: ${{ secrets.AZ2_INGEST_TOKEN }}
        run: python scripts/market_pulse.py
